    Open the browser console to see the output
    (press F12, then choose the "Console" tab).

  <!--
    Three common ways to add JavaScript to an HTML page:
    1. External file : <script src="basics.js"></script>   (used below, best practice)
    2. Inline script : <script> ...code... </script>       (used below as a small demo)
    3. Inline attribute handlers (not used - that is event handling, a later topic)
  -->

  <!-- Inline script: JavaScript written directly inside the HTML file -->
  <script>
    console.log("Message from the INLINE script inside index.html");
  </script>

  <!-- External script: links the separate file basics.js (same folder as this HTML file) -->
  <script src="basics.js"></script>
</body>
